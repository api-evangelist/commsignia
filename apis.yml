name: Commsignia
description: 'Commsignia is a Budapest-based V2X (Vehicle-to-Everything) technology company building
  connected vehicle and smart infrastructure solutions for the automotive and transportation industries.
  Its portfolio spans roadside units (RSUs) and onboard units (OBUs), a V2X software stack, and cloud
  services grouped into product suites: Roadway Intelligence, Emergency Safety, Fleet, Automotive, Smart
  Infrastructure, and Connected Vehicle. The company turns isolated roadway and vehicle data silos into
  real-world operational intelligence for safer roads and improved traffic flow. As of this enrichment
  pass Commsignia publishes no public developer API, REST/OpenAPI reference, SDK, or developer portal;
  technical integration is handled through direct engagement. It was surfaced as a portfolio company of
  Partech.'
